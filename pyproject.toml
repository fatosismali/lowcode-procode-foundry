[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry-yaml-orchestrator"
version = "1.0.0"
description = "Run Microsoft Foundry agent teams directly from YAML definitions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Vodafone AI Team", email = "ai@vodafone.com"}
]
keywords = ["agent", "framework", "foundry", "yaml", "orchestration"]

dependencies = [
    "agent-framework>=1.11.0",
    "azure-identity>=1.14.0",
    "fastapi>=0.115.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/fatosismali/lowcode-procode-foundry"
Repository = "https://github.com/fatosismali/lowcode-procode-foundry.git"
Documentation = "https://github.com/fatosismali/lowcode-procode-foundry/blob/main/README.md"

[project.scripts]
foundry-team = "orchestrator:main"

[tool.hatch.build.targets.wheel]
only-include = ["orchestrator.py"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
